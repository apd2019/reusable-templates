#This file stores all configuration values (URL, browser type, timeouts) in one place. By externalizing config, you can change the browser or URL without touching any Java code.

#browser to use - chrome, firefox, edge
browser=chrome

#base URL of the application under test
base.url=https://formy-project.herokuapp.com/

#implicit wait in seconds
implicit.wait=10

#explicit wait in seconds
explicit.wait=15

#whether to run headless (true/false)
headless=false